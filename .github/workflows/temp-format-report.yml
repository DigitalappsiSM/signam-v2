name: Temp format report files

on:
  push:
    branches:
      - feature/quividi-brand-pdf-v2

permissions:
  contents: write

jobs:
  format-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/quividi-brand-pdf-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Formatear archivos del reporte
        run: npx prettier --write src/modules/exports/quividiCampaignPdf.ts src/modules/exports/quividiCampaignPdf.test.ts src/assets/reports/liverpoolReportImages.ts
      - name: Guardar formato en la rama
        run: |
          if git diff --quiet; then
            echo "Sin cambios de formato"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/exports/quividiCampaignPdf.ts src/modules/exports/quividiCampaignPdf.test.ts src/assets/reports/liverpoolReportImages.ts
          git commit -m "style: aplica prettier al PDF comercial"
          git push origin HEAD:feature/quividi-brand-pdf-v2
