name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    name: Documentación al día
    # La documentación de este repositorio se carga en cada sesión de IA y hace
    # de especificación de las reglas de negocio: si el código cambia y ella no,
    # quedan instrucciones falsas en circulación.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # El guardia compara contra el ancestro común con la rama base.
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Comprobar deriva entre código y documentación
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node scripts/check-docs-freshness.mjs \
            "origin/${{ github.event.pull_request.base.ref }}" \
            "${{ github.event.pull_request.head.sha }}"

  quality:
    name: Lint, typecheck, test y build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Pruebas (Vitest)
        run: npm run test

      - name: Build (Vite)
        run: npm run build

  functions:
    name: Build de Cloud Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Instalar dependencias de functions
        working-directory: functions
        run: npm install

      - name: Build de functions
        working-directory: functions
        run: npm run build
