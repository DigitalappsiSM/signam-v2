name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  format_quividi:
    name: Formatear rama Quividi
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feature/quividi-phase-1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rama
        uses: actions/checkout@v4
        with:
          ref: feature/quividi-phase-1
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Aplicar Prettier
        run: npx prettier --write "src/**/*.{ts,tsx,css,json,md}"
      - name: Commit de formato
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "chore(quividi): apply prettier"
          git push origin HEAD:feature/quividi-phase-1

  quality:
    name: Lint, typecheck, test y build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Pruebas (Vitest)
        run: npm run test

      - name: Build (Vite)
        run: npm run build

  functions:
    name: Build de Cloud Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Instalar dependencias de functions
        working-directory: functions
        run: npm install

      - name: Build de functions
        working-directory: functions
        run: npm run build
