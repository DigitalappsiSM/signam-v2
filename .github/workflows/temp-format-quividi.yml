name: Temp format Quividi

on:
  push:
    branches:
      - feat/quividi-phase-1
    paths:
      - '.github/workflows/temp-format-quividi.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/quividi-phase-1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Aplicar Prettier
        run: |
          npx prettier --write             src/domain/constants.ts             src/modules/admira-catalog/CatalogPage.tsx             src/modules/admira-catalog/masterImport.test.ts             src/modules/quividi/audience.ts             src/modules/quividi/coverage.ts             src/modules/quividi/reportExcel.ts             src/services/quividi.ts             src/services/screens.ts
      - name: Commit de formato
        run: |
          if git diff --quiet; then
            echo "Sin cambios de formato"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/domain/constants.ts             src/modules/admira-catalog/CatalogPage.tsx             src/modules/admira-catalog/masterImport.test.ts             src/modules/quividi/audience.ts             src/modules/quividi/coverage.ts             src/modules/quividi/reportExcel.ts             src/services/quividi.ts             src/services/screens.ts
          git commit -m "chore: format Quividi phase 1"
          git push origin HEAD:feat/quividi-phase-1
