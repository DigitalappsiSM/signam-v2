name: Temporary format PR 125

on:
  push:
    branches:
      - feat/brand-audience-pdf-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/brand-audience-pdf-v2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format report files
        run: npx prettier --write src/modules/exports/quividiBrandReport.ts src/modules/exports/quividiCampaignPdf.ts
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/exports/quividiBrandReport.ts src/modules/exports/quividiCampaignPdf.ts
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -m "style(quividi): apply prettier to audience report"
          git push origin HEAD:feat/brand-audience-pdf-v2
